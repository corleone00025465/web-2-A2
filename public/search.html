<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search fictional charity events by date, location and category.">
  <title>Search Events | HopeBridge</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="search-page">
  <header class="site-header">
    <nav class="nav shell" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="HopeBridge home"><span class="brand-mark" aria-hidden="true">HB</span><span>HopeBridge</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primaryNav" aria-label="Open navigation"><span></span><span></span><span></span></button>
      <div class="nav-links" id="primaryNav"><a href="index.html">Home</a><a class="active" href="search.html">Search Events</a><a href="index.html#organisations">About Us</a></div>
    </nav>
  </header>
  <main class="search-main shell">
    <div class="page-title"><p class="eyebrow">FIND YOUR WAY TO HELP</p><h1>Search charity events</h1><p>Filter public events by any one condition or combine all three.</p></div>
    <div class="search-layout">
      <aside class="filter-panel" aria-labelledby="filterTitle">
        <h2 id="filterTitle">Filter events</h2>
        <form id="searchForm" class="filters">
          <label class="field" for="date">Event date<input id="date" name="date" type="date"></label>
          <label class="field" for="location">Location<input id="location" name="location" type="search" maxlength="100" placeholder="Brisbane, Sydney..."></label>
          <label class="field" for="category">Category<select id="category" name="category"><option value="">All categories</option></select></label>
          <div class="filter-actions"><button class="button button-primary" type="submit">Search Events</button><button class="button button-secondary" id="clear" type="button">Clear Filters</button></div>
        </form>
      </aside>
      <section class="results-panel" aria-labelledby="resultsTitle">
        <div class="results-heading"><div><p class="eyebrow">PUBLIC EVENTS ONLY</p><h2 id="resultsTitle">Search results</h2></div><span class="results-accent" aria-hidden="true">&#9829;</span></div>
        <p id="searchMessage" class="message" role="status">Loading categories...</p>
        <div id="results" class="search-results" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner"><span>HopeBridge Charity Events</span><span>PROG2002 A2 &middot; All sample content is fictional.</span></div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
